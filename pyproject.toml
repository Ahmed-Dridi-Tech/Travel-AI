[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ai"
version = "0.1.0"
description = "Multilingual conversational AI assistant for Tunisian travel agencies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "greenlet>=3.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Heavy ML stack, kept out of the base image so the API boots fast in CI/Docker.
nlp = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "sentence-transformers>=3.0",
    "spacy>=3.7",
    "fasttext-wheel>=0.9.2",
]
frontend = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
